# Drop-in for bazaar-calc.service: keeps the PC from going to sleep while the scanner runs (a sleeping PC cannot poll).
# The screen can still lock and turn off. Installed by `scripts/bazaar.sh keepawake-on`, removed by `keepawake-off`.
[Service]
ExecStart=
ExecStart=/usr/bin/systemd-inhibit --what=sleep:idle --mode=block --who=Bazaar\x20Calc --why=Scanner\x20polls\x20Hypixel\x20every\x2020\x20s /usr/bin/env node packages/api/dist/all.js
