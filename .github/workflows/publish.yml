# Builds the website's data from every approved contribution and publishes the static site on GitHub Pages.
# Runs after every merge to main, after every push of the always-on scanner (every 30 min, packages/collector/src/scanner.ts),
# once a day (recipes, items and the mayor election stay current), or by hand.
name: Publish the website
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bc/shared --filter @bc/server-core --filter @bc/collector build
      - name: Move approved contributions from data/inbox to data/contrib
        run: |
          node scripts/data/file-inbox.mjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Move approved data from data/inbox to data/contrib"
            # the scanner may have pushed meanwhile: put this commit on top of it and try again
            for i in 1 2 3; do git push && break; git pull --rebase origin main; done
          fi
      - name: Build the site data
        run: node scripts/data/build-site.mjs --out site-data
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the static site
        run: node scripts/site/build-pages.mjs --site-data site-data --base "${{ steps.pages.outputs.base_path }}/" --out pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
