# Type checks and tests for code changes.
name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
    paths-ignore: ["data/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
